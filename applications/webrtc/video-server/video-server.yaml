apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webrtc-video-server
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  destination:
    name: in-cluster
    namespace: media
  source:
    repoURL: https://github.com/rgordill/webrtc.git
    targetRevision: HEAD
    path: manifests/video-server/base
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
