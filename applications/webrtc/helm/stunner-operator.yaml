apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stunner-operator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    name: in-cluster
    namespace: stunner-system
  sources:
    - repoURL: https://l7mp.io/stunner
      chart: stunner
      targetRevision: 2.0.0
      helm:
        releaseName: stunner
        valueFiles:
          - $values/manifests/stunner-operator/helm/values.yaml
    - repoURL: https://github.com/rgordill/webrtc.git
      targetRevision: HEAD
      ref: values
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
