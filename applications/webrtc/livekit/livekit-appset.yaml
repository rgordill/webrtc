apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: webrtc-livekit
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            argocd.argoproj.io/cluster-name: in-cluster
  template:
    metadata:
      name: webrtc-livekit
      namespace: openshift-gitops
      annotations:
        argocd.argoproj.io/sync-wave: "2"
        ingress-host: 'livekit.{{ index .metadata.annotations "ingress-domain" }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/rgordill/webrtc.git
        targetRevision: HEAD
        path: manifests/livekit/base
        kustomize:
          patches:
            - target:
                kind: Ingress
                name: livekit-server
              patch: |-
                - op: replace
                  path: /spec/rules/0/host
                  value: "livekit.{{ index .metadata.annotations "ingress-domain" }}"
                - op: replace
                  path: /spec/tls/0/hosts/0
                  value: "livekit.{{ index .metadata.annotations "ingress-domain" }}"
            - target:
                kind: Ingress
                name: livekit-test
              patch: |-
                - op: replace
                  path: /spec/rules/0/host
                  value: "livekit-test.{{ index .metadata.annotations "ingress-domain" }}"
                - op: replace
                  path: /spec/tls/0/hosts/0
                  value: "livekit-test.{{ index .metadata.annotations "ingress-domain" }}"
            - target:
                kind: Certificate
                name: livekit-labmad
              patch: |-
                - op: replace
                  path: /spec/dnsNames/0
                  value: "livekit.{{ index .metadata.annotations "ingress-domain" }}"
                - op: replace
                  path: /spec/dnsNames/1
                  value: "livekit-test.{{ index .metadata.annotations "ingress-domain" }}"
            - target:
                kind: HTTPRoute
                name: livekit-server
              patch: |-
                - op: replace
                  path: /spec/hostnames/0
                  value: "livekit.{{ index .metadata.annotations "ingress-domain" }}"
            - target:
                kind: HTTPRoute
                name: livekit-test
              patch: |-
                - op: replace
                  path: /spec/hostnames/0
                  value: "livekit-test.{{ index .metadata.annotations "ingress-domain" }}"
            - target:
                kind: HTTPRoute
                name: video-server
              patch: |-
                - op: replace
                  path: /spec/hostnames/0
                  value: "video-server.{{ index .metadata.annotations "ingress-domain" }}"
            - target:
                kind: EnvoyProxy
                name: webrtc-envoy
              patch: |-
                - op: replace
                  path: /spec/provider/kubernetes/envoyDeployment/patch/value/spec/template/spec/containers/0/securityContext/runAsUser
                  value: {{ index .metadata.annotations "media-uid" }}
                - op: replace
                  path: /spec/provider/kubernetes/envoyDeployment/patch/value/spec/template/spec/containers/1/securityContext/runAsUser
                  value: {{ index .metadata.annotations "media-uid" }}
      destination:
        server: "{{.server}}"
        namespace: media
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
