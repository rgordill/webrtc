apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webrtc-stunner-config
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  destination:
    name: in-cluster
    namespace: stunner-system
  source:
    repoURL: https://github.com/rgordill/webrtc.git
    targetRevision: codex/stunner-implementation
    path: manifests/stunner
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
