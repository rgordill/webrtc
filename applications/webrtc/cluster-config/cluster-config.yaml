apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webrtc-cluster-config
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    name: in-cluster
    namespace: openshift-gitops
  source:
    repoURL: https://github.com/rgordill/webrtc.git
    targetRevision: codex/stunner-implementation
    path: manifests/cluster-config
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
