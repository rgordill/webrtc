# Admin bootstrap for the Envoy/LiveKit GitOps slice; no Secret access.
apiVersion: v1
kind: Namespace
metadata:
  name: media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webrtc-gitops-reconciler
  namespace: media
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  - services
  verbs: &id001
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  verbs: *id001
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs: *id001
- apiGroups:
  - cert-manager.io
  resources:
  - issuers
  - certificates
  verbs:
  - create
- apiGroups:
  - cert-manager.io
  resources:
  - issuers
  - certificates
  resourceNames:
  - livekit-labmad
  verbs:
  - get
  - list
  - watch
  - update
  - patch
  - delete
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gateways
  - httproutes
  - udproutes
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - gateway.envoyproxy.io
  resources:
  - envoyproxies
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webrtc-gitops-reconciler
  namespace: media
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webrtc-gitops-reconciler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webrtc-gitops-gatewayclass
rules:
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gatewayclasses
  verbs:
  - create
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gatewayclasses
  resourceNames:
  - webrtc-envoy
  verbs:
  - get
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webrtc-gitops-gatewayclass
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: webrtc-gitops-gatewayclass
