apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: video-server
  namespace: media
  labels:
    app.kubernetes.io/name: video-server
  annotations:
    # OpenShift maps this Ingress to a Route. Do not set spec.tls with an
    # empty secretName on OCP 5 — the ingress-to-route controller skips it.
    # Edge + Redirect here uses the cluster wildcard cert.
    route.openshift.io/termination: edge
    route.openshift.io/insecure-policy: Redirect
spec:
  ingressClassName: openshift-default
  rules:
    # PLACEHOLDER → patched by ApplicationSet from cluster ingress-domain
    - host: PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: video-server
                port:
                  number: 8080
