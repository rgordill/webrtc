apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: video-server
  namespace: media
  labels:
    app.kubernetes.io/name: video-server
  annotations:
    route.openshift.io/termination: edge
    route.openshift.io/insecure-policy: Redirect
spec:
  ingressClassName: openshift-default
  # Empty secretName: OpenShift router uses the cluster wildcard cert for
  # *.apps.<cluster-domain>.
  tls:
    - hosts:
        - video-server.apps.example.com
  rules:
    - host: video-server.apps.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: video-server
                port:
                  number: 8080
