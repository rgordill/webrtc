apiVersion: v1
kind: ConfigMap
metadata:
  name: video-server-config
  namespace: media
  labels:
    app.kubernetes.io/name: video-server
data:
  # Name of the video file copied into the `video-source` PVC. The sample
  # asset in video/ (gitignored) is free-video.webm (vp9/opus).
  video-file: "video.webm"
  # Transcode to h264/aac for browser HLS. No -re: encode as fast as the
  # CPU allows so the live playlist stays ahead of the player. ultrafast +
  # 720p keeps a ~1GB vp9 source near/above realtime on 2 cores.
  # For already-compatible sources (h264/aac mp4) use stream copy:
  #   -re -stream_loop -1 -i /media/video.mp4 -c:v copy -c:a copy -f hls ...
  ffmpeg-args: >-
    -stream_loop -1 -i /media/video.webm
    -vf scale=-2:720
    -c:v libx264 -preset ultrafast -tune zerolatency
    -profile:v main -pix_fmt yuv420p -g 48 -keyint_min 48
    -c:a aac -b:a 128k -ac 2
    -f hls -hls_time 2 -hls_list_size 20
    -hls_flags delete_segments+append_list+independent_segments
    -hls_segment_filename /hls/seg_%05d.ts
    /hls/index.m3u8
