apiVersion: v1
kind: ConfigMap
metadata:
  name: video-server-config
  namespace: media
  labels:
    app.kubernetes.io/name: video-server
data:
  # Name of the video file copied into the `video-source` PVC. The sample
  # asset in video/ (gitignored) is free-video.webm (vp9/opus).
  video-file: "video.webm"
  # Transcode to h264/aac for browser HLS. For already-compatible sources
  # (h264/aac mp4) you can switch to stream copy:
  #   -re -stream_loop -1 -i /media/video.mp4 -c:v copy -c:a copy -f hls ...
  ffmpeg-args: >-
    -re -stream_loop -1 -i /media/video.webm
    -c:v libx264 -preset veryfast -profile:v main -pix_fmt yuv420p
    -c:a aac -b:a 128k
    -f hls -hls_time 4 -hls_list_size 6
    -hls_flags delete_segments+append_list
    -hls_segment_filename /hls/seg_%05d.ts
    /hls/index.m3u8
