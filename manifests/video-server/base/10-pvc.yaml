apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: video-source
  namespace: media
  labels:
    app.kubernetes.io/name: video-server
spec:
  # Azure Disk (managed-csi, default) is RWO only. Single-replica Deployment
  # + one-shot upload Job share the claim sequentially.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # Omit storageClassName to use the cluster default (managed-csi on Azure).
