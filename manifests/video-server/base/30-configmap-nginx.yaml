apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: media
  labels:
    app.kubernetes.io/name: video-server
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      # HLS consumed by a browser player on another origin needs CORS.
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Origin, Accept" always;

      # OpenShift Router-backed probe/health endpoint.
      location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location /hls/ {
        root /usr/share/nginx/html;
        types {
          application/vnd.apple.mpegurl m3u8;
          video/mp2t ts;
        }
        # Playlists must not be cached: browsers re-fetch them for the live edge.
        add_header Cache-Control "no-cache";
        try_files $uri =404;
      }

      location / {
        root /usr/share/nginx/html/player;
        index index.html;
      }
    }
