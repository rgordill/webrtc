apiVersion: v1
kind: ConfigMap
metadata:
  name: video-player
  namespace: media
  labels:
    app.kubernetes.io/name: video-server
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8"/>
      <title>Video</title>
      <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
      <style>
        body { background:#111; color:#eee; font-family:sans-serif;
               display:flex; flex-direction:column; align-items:center; }
        video { width:min(90vw, 960px); margin-top:2rem; }
      </style>
    </head>
    <body>
      <video id="v" controls autoplay muted playsinline></video>
      <script>
        const src = "/hls/index.m3u8";
        const video = document.getElementById("v");
        if (Hls.isSupported()) {
          const hls = new Hls({ liveDurationInfinity: true });
          hls.loadSource(src);
          hls.attachMedia(video);
          hls.on(Hls.Events.ERROR, (_, data) => {
            // play out the live edge immediately instead of from the oldest segment
            if (data.fatal && data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
          });
          video.addEventListener("loadedmetadata", () => {
            if (video.duration === Infinity || hls.liveSyncPosition !== null) {
              video.currentTime = hls.liveSyncPosition ?? video.duration - 8;
            }
          });
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = src; // Safari native HLS
        }
      </script>
    </body>
    </html>
