apiVersion: stunner.l7mp.io/v1
kind: UDPRoute
metadata:
  name: livekit-server
  namespace: stunner-system
  labels:
    app.kubernetes.io/part-of: webrtc
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: media-gateway
  rules:
    # STUNner lets relayed clients reach the backend pods at any port, not
    # only the ports listed on the Service: one UDPRoute covers every media
    # port of the LiveKit pods.
    - backendRefs:
        - group: ""
          kind: Service
          name: livekit-server
          namespace: media
