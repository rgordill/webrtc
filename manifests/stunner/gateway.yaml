apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: media-gateway
  namespace: stunner-system
  labels:
    app.kubernetes.io/part-of: webrtc
  annotations:
    stunner.l7mp.io/service-type: LoadBalancer
    # Azure Standard LB cannot health-check UDP. STUNner matches
    # service.beta.kubernetes.io/*health*port/protocol annotations and opens
    # the dataplane HTTP /live endpoint on the LoadBalancer Service.
    service.beta.kubernetes.io/port_3478_health-probe_protocol: Http
    service.beta.kubernetes.io/port_3478_health-probe_port: "8086"
    service.beta.kubernetes.io/port_3478_health-probe_request-path: /live
spec:
  gatewayClassName: stunner-gatewayclass
  listeners:
    - name: turn-udp
      port: 3478
      protocol: TURN-UDP
      # Accept UDPRoutes from outside stunner-system (the LiveKit backend
      # is in the media namespace).
      allowedRoutes:
        namespaces:
          from: All
    # TURN over TLS on 443 (unblocks clients behind restrictive firewalls).
    # Needs a TLS secret; create it via cert-manager or manually, then
    # uncomment:
    # - name: turn-tls
    #   port: 443
    #   protocol: TURN-TLS
    #   tls:
    #     mode: Terminate
    #     certificateRefs:
    #       - kind: Secret
    #         namespace: stunner-system
    #         name: turn-tls-cert
    #   allowedRoutes:
    #     namespaces:
    #       from: All
