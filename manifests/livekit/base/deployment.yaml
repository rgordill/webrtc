apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livekit-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: livekit
        image: docker.io/livekit/livekit-server:v1.13.11
        args:
        - --config
        - /etc/livekit/livekit.yaml
        ports:
        - name: http
          containerPort: 7880
        - name: rtc-udp
          containerPort: 7882
          protocol: UDP
        volumeMounts:
        - name: config
          mountPath: /etc/livekit/livekit.yaml
          subPath: livekit.yaml
          readOnly: true
        - name: keys
          mountPath: /etc/livekit/keys
          readOnly: true
        readinessProbe:
          httpGet:
            path: /
            port: http
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 20
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: livekit-config
      - name: keys
        secret:
          secretName: livekit-keys
          defaultMode: 288
          items:
          - key: keys.yaml
            path: keys.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: livekit-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livekit-test
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
        ports:
        - name: http
          containerPort: 8080
        volumeMounts:
        - name: client
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
          readOnly: true
        - name: client
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true
        readinessProbe:
          httpGet:
            path: /
            port: http
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: client
        configMap:
          name: livekit-test
