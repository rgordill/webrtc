apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: livekit-labmad
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  ca:
    secretName: livekit-labmad-issuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: livekit-labmad
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: livekit-labmad-tls
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
  dnsNames:
    - LIVEKIT_HOST_PLACEHOLDER
    - PLAYER_HOST_PLACEHOLDER
  issuerRef:
    name: livekit-labmad
    kind: Issuer
    group: cert-manager.io
