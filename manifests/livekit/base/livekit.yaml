port: 7880
bind_addresses: ["0.0.0.0"]
key_file: /etc/livekit/keys/keys.yaml
redis:
  address: livekit-redis.media.svc.cluster.local:6379
rtc:
  use_external_ip: false
  udp_port: 7882
  tcp_port: 0
  # LiveKit's native TURN advertisement uses its private node IP. Add a public
  # Envoy alias authenticated by the same embedded TURN server (not external TURN).
  turn_servers:
    - host: PUBLIC_TURN_HOST_PLACEHOLDER
      port: 3478
      protocol: udp
      username: TURN_USERNAME_PLACEHOLDER
      credential: TURN_PASSWORD_PLACEHOLDER
turn:
  enabled: true
  udp_port: 3478
  relay_range_start: 40000
  relay_range_end: 40511
  # The alias is shared by this small single-node demo. Bound its allocations.
  per_user_relay_allocation_limit: 128
  # Embedded TURN also enforces local-node/media-port restrictions.
  allow_restricted_peer_cidrs:
    - POD_CIDR_PLACEHOLDER
