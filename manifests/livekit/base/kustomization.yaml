apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - deployment.yaml
  - service.yaml
  - certificate.yaml
  - ingress.yaml
  - streaming.yaml
  - ../../envoy
configMapGenerator:
  - name: livekit-config
    files:
      - livekit.yaml
  - name: livekit-test
    files:
      - index.html
      - default.conf
  - name: livekit-ingress-config
    files:
      - ingress.yaml.conf
  - name: livekit-stream-config
    envs:
      - stream.env
  - name: livekit-stream-code
    files:
      - publish-stream.py
  - name: livekit-turn-init
    files:
      - prepare-turn.py
