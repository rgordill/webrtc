apiVersion: v1
kind: Service
metadata:
  name: livekit-server
spec:
  selector:
    app.kubernetes.io/name: livekit-server
  ports:
  - name: http
    port: 7880
    targetPort: http
  - name: rtc-udp
    port: 7882
    targetPort: rtc-udp
    protocol: UDP
  - name: turn-udp
    port: 3478
    targetPort: turn-udp
    protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-test
spec:
  selector:
    app.kubernetes.io/name: livekit-test
  ports:
  - name: http
    port: 8080
    targetPort: http
