# PostSync: discover the OpenShift ingress subdomain and publish it in
# openshift-gitops for ApplicationSets (Secret annotation) and for any
# consumer that prefers a ConfigMap.
apiVersion: batch/v1
kind: Job
metadata:
  name: cluster-configuration-hook
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: webrtc
        argocd.argoproj.io/hook: "true"
    spec:
      serviceAccountName: cluster-configuration-hook
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: get-ingress-domain
          image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -ec
            - |
              DOMAIN=$(kubectl get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}' 2>/dev/null) || true
              [ -z "$DOMAIN" ] && echo "Error: No ingress domain found" && exit 1
              echo "Discovered ingress domain: ${DOMAIN}"

              # ConfigMap — simple subdomain source in openshift-gitops
              cat <<EOF | sed 's/^              //' | kubectl apply -n openshift-gitops -f -
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: cluster-ingress-domain
                labels:
                  app.kubernetes.io/part-of: webrtc
              data:
                domain: "${DOMAIN}"
              EOF

              # Argo CD cluster Secret — ApplicationSet clusters generator
              # reads metadata.annotations.ingress-domain
              cat <<EOF | sed 's/^              //' | kubectl apply -n openshift-gitops -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: openshift-gitops-cluster-configuration
                labels:
                  argocd.argoproj.io/secret-type: cluster
                  argocd.argoproj.io/cluster-name: in-cluster
                annotations:
                  ingress-domain: "${DOMAIN}"
              type: Opaque
              stringData:
                name: in-cluster
                server: https://kubernetes.default.svc
              EOF
