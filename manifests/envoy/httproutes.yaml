apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: livekit-server
  namespace: media
spec:
  parentRefs:
  - name: webrtc-envoy
    sectionName: http
  hostnames:
  - PLACEHOLDER
  rules:
  - backendRefs:
    - name: livekit-server
      port: 7880
---
