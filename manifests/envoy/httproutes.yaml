apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: livekit-server
  namespace: media
spec:
  parentRefs:
  - name: webrtc-envoy
    sectionName: http
    group: gateway.networking.k8s.io
    kind: Gateway
  hostnames:
  - PLACEHOLDER
  rules:
  - backendRefs:
    - name: livekit-server
      port: 7880
      group: ''
      kind: Service
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
---
