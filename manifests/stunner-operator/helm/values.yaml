# OpenShift already ships Gateway API CRDs (standard channel). Installing a
# second copy from the chart conflicts with the cluster versions, so keep
# both chart-bundled Gateway API CRD packages disabled. STUNner's own CRDs
# (UDPRoute, GatewayConfig, Dataplane, StaticService) still install from the
# chart's crds/ directory.
standardCrds:
  enabled: false
experimentalCrds:
  enabled: false

stunnerGatewayOperator:
  enabled: true
  deployment:
    replicas: 1
    container:
      manager:
        image:
          tag: "2.0.0"
  dataplane:
    spec:
      replicas: 1
      image:
        tag: "2.0.0"
      # OpenShift restricted-v2: no hostNetwork, non-root.
      hostNetwork: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true

stunnerAuthService:
  enabled: true
  deployment:
    replicas: 1
    container:
      authService:
        image:
          tag: "2.0.0"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
